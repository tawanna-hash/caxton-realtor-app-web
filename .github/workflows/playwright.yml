name: E2E Smoke Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  e2e:
    name: Playwright Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Skip schema bootstrap that needs a real DB. Smoke tests only hit
      # public endpoints + the OpenAPI route, so we can use a placeholder.
      DATABASE_URL: ${{ secrets.E2E_DATABASE_URL || 'postgres://e2e:e2e@localhost:5432/e2e' }}
      JWT_SECRET: ${{ secrets.E2E_JWT_SECRET || 'e2e-jwt-secret-not-real' }}
      ADMIN_JWT_SECRET: ${{ secrets.E2E_ADMIN_JWT_SECRET || 'e2e-admin-jwt-secret-not-real' }}
      NEXT_PUBLIC_SITE_URL: 'http://localhost:3000'
      CI: 'true'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install deps
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Build
        run: npm run build

      - name: Run Playwright
        run: npm run e2e

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
