name: SABOR Realtor Sync

# Runs nightly + on-demand. Scrapes realtytexas.com (public, no auth) and POSTs
# records to the production ingest API. Requires repository secrets:
#   CRON_SECRET  — shared with Vercel CRON_SECRET env var
#   INGEST_URL   — https://<prod-host>/api/admin/mailing/sabor-realtors/ingest

on:
  schedule:
    # 03:00 UTC nightly = 10pm CDT / 9pm CST
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      max_records:
        description: 'Cap on records to upsert (blank = unlimited)'
        required: false
        default: ''
      max_pages_per_letter:
        description: 'Cap on pages walked per letter (default 30)'
        required: false
        default: '30'
      max_letters:
        description: 'Cap on letters walked a-z (default 26)'
        required: false
        default: '26'
      filter:
        description: "Filter mode: sabor | sabor-or-78xxx | all"
        required: false
        default: 'sabor-or-78xxx'

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install deps
        run: npm ci --include=dev

      - name: Run SABOR sync
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          INGEST_URL: ${{ secrets.INGEST_URL }}
          SABOR_MAX_RECORDS: ${{ github.event.inputs.max_records }}
          SABOR_MAX_PAGES_PER_LETTER: ${{ github.event.inputs.max_pages_per_letter || '30' }}
          SABOR_MAX_LETTERS: ${{ github.event.inputs.max_letters || '26' }}
          SABOR_FILTER: ${{ github.event.inputs.filter || 'sabor-or-78xxx' }}
        run: npx tsx scripts/sabor-sync.ts
